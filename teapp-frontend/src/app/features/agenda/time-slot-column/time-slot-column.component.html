<div class="slot-column" [ngClass]="claseFranja">

  <!-- Cabecera de la franja -->
  <div class="slot-header">
    <mat-icon class="slot-icon">{{ iconosFranja[slot] }}</mat-icon>
    <h3 class="slot-title">{{ etiquetasFranja[slot] }}</h3>
    <span class="entry-count" *ngIf="entradasLocales.length > 0">{{ entradasLocales.length }}</span>
  </div>

  <!-- Lista de entradas con drag-and-drop -->
  <div class="entries-list"
       cdkDropList
       [cdkDropListData]="entradasLocales"
       (cdkDropListDropped)="alSoltar($event)">

    <div cdkDrag
         *ngFor="let entry of entradasLocales"
         class="entry-drag-wrapper">

      <div class="drag-handle" cdkDragHandle aria-label="Arrastrar para reordenar">
        <mat-icon>drag_indicator</mat-icon>
      </div>

      <app-entry-card
        [entry]="entry"
        [isCompletedToday]="estaCompletadaHoy(entry)"
        (delete)="alEliminarEntrada($event)"
        class="entry-card-wrapper">
      </app-entry-card>
    </div>

    <div class="empty-slot" *ngIf="entradasLocales.length === 0">
      <p>Sin actividades</p>
    </div>
  </div>

  <!-- Botón agregar actividad -->
  <button mat-stroked-button class="btn-add-activity"
          (click)="abrirSelectorActividad()"
          [attr.aria-label]="'Agregar actividad a ' + etiquetasFranja[slot]">
    <mat-icon>add</mat-icon>
    Agregar
  </button>

</div>
