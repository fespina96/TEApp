spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: TestSecretKeyForJWTAutomatedTestsAtLeast256Bits
    expiration: 86400000
  frontend-url: http://localhost:4200

resend:
  api-key: test_placeholder
  from-email: test@test.com
